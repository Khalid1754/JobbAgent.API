<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>JobbAgent</title>
    <script>
      // Sätter sparat tema och språk innan sidan ritas, så att den inte blinkar vit i mörkt läge.
      try {
        var theme = localStorage.getItem('jobbagent-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (localStorage.getItem('jobbagent-lang') === 'en') document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
